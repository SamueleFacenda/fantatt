# cargo-audit configuration for the fantatt workspace.
#
# Every ignored advisory is an upstream-blocked finding: the patched version is
# outside the semver range of a direct dependency that is already at its latest
# release. Each entry names the blocking crate, the accepted risk, and the
# trigger that reopens it. The dependency watchdog (G0.8) and SA-1 re-check this
# file; a resolved entry is deleted, never left stale.
#
# Phase 0 builds on x86_64-linux only (see flake.nix systems). Rustsec scans
# Cargo.lock across every target, so findings whose crate is absent from the
# x86_64-linux build are ignored here with that justification recorded.

[advisories]
ignore = [
  # pyo3 0.22.6 is pinned by rudof 0.1.12, the latest rudof release. Both
  # advisories are patched only in pyo3 >= 0.24.1 (buffer overflow in
  # PyString::from_object) and >= 0.29.0 (missing Sync bound). rudof is the
  # SHACL/ShEx engine for the G1.9 quarantine flow; revisit on the next rudof
  # release that accepts a patched pyo3.
  "RUSTSEC-2025-0020",
  "RUSTSEC-2026-0177",

  # quick-xml 0.37.5 is pinned by oxrdfxml 0.2.5 (oxigraph 0.5.13) and by
  # rudof's RDF/XML reader. Both advisories (quadratic attribute scan and
  # unbounded namespace allocation in NsReader) are patched only in
  # quick-xml >= 0.41.0. The RDF/XML surface is not reachable from the FITET
  # ingest path, which parses HTML; revisit on oxigraph >= 0.6 or a rudof
  # release that vendors a patched oxrdfxml.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",

  # rsa 0.9.10 is pinned by openidconnect 4.1.0 (latest release) and rsa
  # 0.10.0-rc.19 by crypto-glue 0.2.2 (webauthn-rs 0.6.2). The Marvin timing
  # attack is fixed in rsa 0.10.0, which dropped the sha2 feature crypto-glue
  # requires, so neither edge can move without an upstream release. The keys
  # exercised are session and ID-token verification keys; revisit on
  # openidconnect or webauthn-rs releases that accept rsa >= 0.10.0.
  "RUSTSEC-2023-0071",

  # libsqlite3-sys 0.30.1 reaches Cargo.lock through sqlx-sqlite, which sqlx
  # enables for non-Linux targets. It is absent from the x86_64-linux build
  # graph (cargo tree -p fantatt-api --target x86_64-unknown-linux-gnu lists
  # only sqlx-postgres), so the advisory is not reachable in this
  # configuration. Patched in libsqlite3-sys >= 0.39.0; revisit when sqlx
  # drops the platform-gated sqlite driver or the target matrix widens.
  "RUSTSEC-2026-0459",
]
informational_warnings = ["unmaintained"]

[target]
arch = ["x86_64"]
os = ["linux"]
