[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"
repository = "https://github.com/SamueleFacenda/fantatt"

[workspace.dependencies]
# Domain core deps. fantatt-core is limited to these (docs/11-repo-structure.md §2).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
time = "0.3"

# Async runtime and utilities.
tokio = { version = "1", features = ["full"] }
tower = "0.5.3"
tracing = "0.1"
tracing-subscriber = "0.3"

# HTTP surface (fantatt-api).
axum = "0.8.9"
tower-sessions = "0.15.0"
tower-sessions-sqlx-store = "0.15.1"
utoipa = "6.0.0"
governor = "0.10.4"
validator = "0.21.0"

# Authentication (fantatt-api; passkeys + Google OIDC).
webauthn-rs = "0.6.2"
oauth2 = "5.0.0"
openidconnect = "4.1.0"

# Database (fantatt-jobs, fantatt-api).
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "migrate", "macros"] }

# Knowledge graph and reasoning engine (fantatt-reasoning).
# rudof is not pinned yet: the 0.1.12 release does not compile against the
# current releases of its shacl_ast/shacl_validation/srdf family, so it lands
# with G1.9 together with the pinned family (see docs/adr/0002).
oxigraph = "0.5.13"
eyeron = "0.9.2"

# Outbound HTTP (fantatt-ingest, fantatt-notify).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "h2"] }

# Scheduling (fantatt-jobs).
tokio-cron-scheduler = "0.15.1"

# Email (fantatt-notify).
# Email facade (fantatt-notify). The default feature set pulls native-tls,
# which needs a system OpenSSL; the rustls features match the rest of the stack
# and keep the build hermetic.
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport", "pool", "hostname"] }

# Configuration (fantatt-config).
config = "0.14"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
